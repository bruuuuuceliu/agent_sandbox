services:
  nats:
    image: nats:2.11-alpine
    command:
      - --jetstream
      - --store_dir=/data
      - --port=15181
      - --http_port=15182
      - --user=${NATS_USERNAME}
      - --pass=${NATS_PASSWORD}
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-15181}:15181"
      - "127.0.0.1:${NATS_MONITOR_PORT:-15182}:15182"
    volumes:
      - nats-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - 'http://127.0.0.1:15182/healthz?js-enabled-only=true' >/dev/null || exit 1
      interval: 2s
      timeout: 1s
      retries: 15

  sandbox-manager:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - --config
      - /config/local.config
    environment:
      MANAGER_PORT: ${MANAGER_PORT:-15180}
      NATS_URL: nats://${NATS_USERNAME}:${NATS_PASSWORD}@nats:15181
    ports:
      - "127.0.0.1:${MANAGER_PORT:-15180}:${MANAGER_PORT:-15180}"
    volumes:
      - ../../config/local.config:/config/local.config:ro
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nats-data:
