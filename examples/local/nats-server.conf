port: 15181
http: 15182

jetstream {
  store_dir: /data
}

authorization {
  users: [
    {
      user: sandbox-manager
      password: $NATS_MANAGER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.>"
            "$JS.ACK.>"
            "sandbox.inbox.sandbox-agent-local.>"
            "sandbox.agent.sandbox-agent-local.task.*.*.out"
            "sandbox.manager.sandbox-agent-local.task.*.ready"
            "sandbox.manager.command.event"
          ]
        }
        subscribe: {
          allow: [
            "sandbox.inbox.sandbox-manager.>"
            "sandbox.agent.sandbox-agent-local.admit"
            "sandbox.agent.sandbox-agent-local.task.*.*.in"
            "sandbox.agent.sandbox-agent-local.task.*.*.closed"
          ]
        }
      }
    }
    {
      user: sandbox-agent-local
      password: $NATS_AGENT_PASSWORD
      permissions: {
        publish: {
          allow: [
            "sandbox.agent.sandbox-agent-local.spawn"
            "sandbox.agent.sandbox-agent-local.admit"
            "sandbox.agent.sandbox-agent-local.task.*.*.in"
            "sandbox.agent.sandbox-agent-local.task.*.*.closed"
          ]
        }
        subscribe: {
          allow: [
            "sandbox.inbox.sandbox-agent-local.>"
            "sandbox.agent.sandbox-agent-local.task.*.*.out"
            "sandbox.manager.sandbox-agent-local.task.*.ready"
          ]
        }
      }
    }
  ]
}
