# Template for the NATS credential Secret. Do NOT commit a real Secret.
#
# Create the Secret out-of-band with the actual credentials, e.g.:
#   kubectl -n sandbox-manager create secret generic sandbox-manager-nats \
#     --from-literal=NATS_USERNAME=<user> --from-literal=NATS_PASSWORD=<pass>
#
# The manager consumes these as environment variables; the `NATS_URL` in the
# mounted ConfigMap expands them. The values never reach a ConfigMap, audit
# record, or log.
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-manager-nats
  namespace: sandbox-manager
  labels:
    app.kubernetes.io/part-of: sandbox-manager
type: Opaque
stringData:
  NATS_USERNAME: "<replace-me>"
  NATS_PASSWORD: "<replace-me>"
